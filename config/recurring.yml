production:
  # เริ่มการประมูลที่ถึงเวลาแล้วแต่ยังไม่เริ่ม (EVT-07) เผื่อ job ที่ตั้งเวลาไว้หลุด
  start_due_auction_events:
    class: StartDueAuctionEventsJob
    queue: default
    schedule: every minute
  # สรุปผลการประมูลที่เลยเวลาปิดรับราคาแล้วแต่ยังไม่สรุป (BID-06, NFR-06) เผื่อ job ที่ตั้งเวลาไว้หลุด
  settle_due_auction_events:
    class: SettleDueAuctionEventsJob
    queue: default
    schedule: every minute
  clear_solid_queue_finished_jobs:
    command: "SolidQueue::Job.clear_finished_in_batches(sleep_between_batches: 0.3)"
    schedule: every hour at minute 12
