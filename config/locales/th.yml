# ภาษาไทยของระบบ (NFR-01) · locale เริ่มต้นตั้งที่ config/application.rb
#
# ครอบ key ที่ Rails ใช้ (error ของ validation, วันที่/เวลา, ตัวเลข/เงิน, helper ของฟอร์ม)
# test/i18n/locale_test.rb ตรวจว่า key เหล่านี้ครบเทียบกับ en เสมอ
#
# ข้อความของโมเดล/หน้าจอเราเอง: เพิ่มใน config/locales/ ไฟล์ใหม่ต่อหมวด (เช่น users.th.yml)
# หรือเขียนข้อความไทยตรงๆ ในโค้ดก็ได้ ตามที่โมเดลอื่นทำอยู่
#
# วันที่: l(time) ให้ปี ค.ศ. ตามกลไกของ Rails
# ข้อความที่แสดงให้ผู้ใช้เห็นให้ใช้ thai_date / thai_datetime ใน FormatHelper (ปี พ.ศ.)
th:
  date:
    abbr_day_names: [อา., จ., อ., พ., พฤ., ศ., ส.]
    abbr_month_names: [~, ม.ค., ก.พ., มี.ค., เม.ย., พ.ค., มิ.ย., ก.ค., ส.ค., ก.ย., ต.ค., พ.ย., ธ.ค.]
    day_names: [อาทิตย์, จันทร์, อังคาร, พุธ, พฤหัสบดี, ศุกร์, เสาร์]
    month_names: [~, มกราคม, กุมภาพันธ์, มีนาคม, เมษายน, พฤษภาคม, มิถุนายน, กรกฎาคม, สิงหาคม, กันยายน, ตุลาคม, พฤศจิกายน, ธันวาคม]
    order: [day, month, year]
    formats:
      default: "%d/%m/%Y"
      long: "%-d %B %Y"
      short: "%-d %b"

  time:
    am: ก่อนเที่ยง
    pm: หลังเที่ยง
    formats:
      default: "%-d %b %Y %H:%M:%S"
      long: "%-d %B %Y %H:%M น."
      short: "%-d %b %H:%M"

  datetime:
    distance_in_words:
      about_x_hours:
        one: ประมาณ 1 ชั่วโมง
        other: ประมาณ %{count} ชั่วโมง
      about_x_months:
        one: ประมาณ 1 เดือน
        other: ประมาณ %{count} เดือน
      about_x_years:
        one: ประมาณ 1 ปี
        other: ประมาณ %{count} ปี
      almost_x_years:
        one: เกือบ 1 ปี
        other: เกือบ %{count} ปี
      half_a_minute: ครึ่งนาที
      less_than_x_minutes:
        one: น้อยกว่า 1 นาที
        other: น้อยกว่า %{count} นาที
      less_than_x_seconds:
        one: น้อยกว่า 1 วินาที
        other: น้อยกว่า %{count} วินาที
      over_x_years:
        one: มากกว่า 1 ปี
        other: มากกว่า %{count} ปี
      x_days:
        one: 1 วัน
        other: "%{count} วัน"
      x_minutes:
        one: 1 นาที
        other: "%{count} นาที"
      x_months:
        one: 1 เดือน
        other: "%{count} เดือน"
      x_seconds:
        one: 1 วินาที
        other: "%{count} วินาที"
    prompts:
      day: วัน
      hour: ชั่วโมง
      minute: นาที
      month: เดือน
      second: วินาที
      year: ปี
    relative:
      future: "ในอีก %{time}"
      past: "%{time}ที่แล้ว"

  # ข้อความ error ของ validation: แสดงใต้ช่อง จึงเป็นประโยคสั้นที่ไม่มีชื่อช่อง (NFR-11)
  # full_messages จะเป็น "<ชื่อช่อง> <ข้อความ>"
  errors:
    format: "%{attribute} %{message}"
    messages:
      accepted: ต้องยอมรับก่อน
      blank: ต้องกรอก
      confirmation: ไม่ตรงกับ%{attribute}
      empty: ต้องไม่ว่างเปล่า
      equal_to: ต้องเท่ากับ %{count}
      even: ต้องเป็นเลขคู่
      exclusion: เป็นค่าที่ไม่อนุญาตให้ใช้
      greater_than: ต้องมากกว่า %{count}
      greater_than_or_equal_to: ต้องมากกว่าหรือเท่ากับ %{count}
      in: ต้องอยู่ในช่วง %{count}
      inclusion: ไม่อยู่ในรายการที่เลือกได้
      invalid: รูปแบบไม่ถูกต้อง
      less_than: ต้องน้อยกว่า %{count}
      less_than_or_equal_to: ต้องน้อยกว่าหรือเท่ากับ %{count}
      model_invalid: "ข้อมูลไม่ถูกต้อง: %{errors}"
      not_a_number: ต้องเป็นตัวเลข
      not_an_integer: ต้องเป็นจำนวนเต็ม
      odd: ต้องเป็นเลขคี่
      other_than: ต้องไม่เท่ากับ %{count}
      password_too_long: ยาวเกินไป
      present: ต้องเว้นว่างไว้
      required: ต้องระบุ
      taken: ถูกใช้แล้ว
      too_long:
        one: ยาวเกินไป (ไม่เกิน 1 ตัวอักษร)
        other: ยาวเกินไป (ไม่เกิน %{count} ตัวอักษร)
      too_short:
        one: สั้นเกินไป (อย่างน้อย 1 ตัวอักษร)
        other: สั้นเกินไป (อย่างน้อย %{count} ตัวอักษร)
      wrong_length:
        one: ความยาวต้องเท่ากับ 1 ตัวอักษร
        other: ความยาวต้องเท่ากับ %{count} ตัวอักษร

  activerecord:
    errors:
      messages:
        record_invalid: "ข้อมูลไม่ถูกต้อง: %{errors}"
        restrict_dependent_destroy:
          has_many: ลบไม่ได้ เพราะยังมี%{record}ที่เกี่ยวข้องอยู่
          has_one: ลบไม่ได้ เพราะยังมี%{record}ที่เกี่ยวข้องอยู่

  helpers:
    select:
      prompt: กรุณาเลือก
    submit:
      create: สร้าง%{model}
      submit: บันทึก%{model}
      update: อัปเดต%{model}

  support:
    array:
      last_word_connector: " และ "
      two_words_connector: " และ "
      words_connector: ", "

  # เงินบาท (NFR-01) · ใช้ผ่าน baht / baht_text ใน FormatHelper
  # ระบบนี้ไม่แสดงสตางค์เป็นค่าเริ่มต้น (ดู FormatHelper#baht)
  number:
    currency:
      format:
        delimiter: ","
        format: "%u%n"
        negative_format: "-%u%n"
        precision: 2
        separator: "."
        significant: false
        strip_insignificant_zeros: false
        unit: ฿
    format:
      delimiter: ","
      precision: 3
      round_mode: default
      separator: "."
      significant: false
      strip_insignificant_zeros: false
    human:
      decimal_units:
        format: "%n %u"
        units:
          billion: พันล้าน
          million: ล้าน
          quadrillion: พันล้านล้าน
          thousand: พัน
          trillion: ล้านล้าน
          unit: ""
      format:
        delimiter: ""
        precision: 3
        significant: true
        strip_insignificant_zeros: true
      storage_units:
        format: "%n %u"
        units:
          byte:
            one: ไบต์
            other: ไบต์
          eb: เอกซะไบต์
          gb: กิกะไบต์
          kb: กิโลไบต์
          mb: เมกะไบต์
          pb: เพตะไบต์
          tb: เทราไบต์
          zb: เซตตะไบต์
    percentage:
      format:
        delimiter: ""
        format: "%n%"
    precision:
      format:
        delimiter: ""
